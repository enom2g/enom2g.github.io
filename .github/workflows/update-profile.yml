name: Update Profile
on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Base64 encoded HTML content'
        required: true
        default: ''
      message:
        description: 'Commit message'
        required: true
        default: 'Update index.html'

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update index.html
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = '${{ github.event.inputs.content }}';
            const message = '${{ github.event.inputs.message }}';
            
            // Get current file
            const { data: currentFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'index.html',
              ref: 'master'
            });
            
            // Update file
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'index.html',
              message: message,
              content: content,
              sha: currentFile.sha,
              branch: 'master'
            });